name: Publish Packages

on:
  push:
    branches:
      - main
    paths:
      - 'packages/core/**'
      - 'packages/actions/**'
      - '.github/workflows/publish.yml'
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish'
        required: true
        type: choice
        options:
          - none
          - core
          - actions
          - all
        default: none

permissions:
  contents: read
  id-token: write

jobs:
  publish-typescript:
    name: Publish TypeScript packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          # Latest LTS bundles npm >=11.5.1, which supports npm trusted
          # publishing (OIDC) so publishes work without NPM_TOKEN once the
          # packages have a Trusted Publisher configured on npmjs.com.
          # Token auth keeps working as before. Do not upgrade to npm@12:
          # it has a packaging bug that breaks provenance publishes.
          node-version: 'lts/*'
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: bun install

      - name: Build core
        if: inputs.package == 'core' || inputs.package == 'all'
        run: bun run build
        working-directory: packages/core

      - name: Build actions
        if: inputs.package == 'actions' || inputs.package == 'all'
        run: bun run build
        working-directory: packages/actions

      - name: Publish core
        if: inputs.package == 'core' || inputs.package == 'all'
        run: |
          echo "Publishing @pipeit/core..."
          # Provenance is passed as a publish flag: `npm config set` refuses
          # to run inside a workspaces project (ENOWORKSPACES).
          npm publish --access public --provenance --no-git-checks
        working-directory: packages/core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish actions
        if: inputs.package == 'actions' || inputs.package == 'all'
        run: |
          echo "Publishing @pipeit/actions..."
          # Provenance is passed as a publish flag: `npm config set` refuses
          # to run inside a workspaces project (ENOWORKSPACES).
          npm publish --access public --provenance --no-git-checks
        working-directory: packages/actions
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
