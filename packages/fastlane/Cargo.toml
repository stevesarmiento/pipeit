[package]
name = "pipeit-fastlane"
version = "0.1.6"
edition = "2021"
description = "Native QUIC client for direct Solana TPU transaction submission"
license = "MIT"
repository = "https://github.com/stevesarmiento/pipeit"

[lib]
crate-type = ["cdylib"]

[dependencies]
# NAPI-RS for Node.js bindings
napi = { version = "3", default-features = false, features = ["async", "tokio_rt", "napi9"] }
napi-derive = "3"

# QUIC and TLS
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring"] }

# Solana
solana-tls-utils = "4.0"
solana-client = "4.0"
solana-sdk = "4.0"

# Async runtime
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
yellowstone-grpc-client = { version = "13.1.0" }
yellowstone-grpc-proto = { version = "12.4.0" }

# Data structures
dashmap = "6"

# Error handling
anyhow = "1"
thiserror = "2"

[build-dependencies]
napi-build = "2.3.2"

[profile.release]
lto = false
opt-level = 3
